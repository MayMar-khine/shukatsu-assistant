# Render Blueprint: deploys the FastAPI backend on Render's free plan.
services:
  - type: web
    name: shukatsu-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false   # set this secret in the Render dashboard
      - key: CORS_ORIGINS
        sync: false   # e.g. https://shukatsu-assistant.vercel.app
